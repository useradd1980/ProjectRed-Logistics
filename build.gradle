plugins {
    id 'java'
    id 'net.neoforged.moddev'
}

group = mod_group
version = mod_version

base {
    archivesName = 'ProjectRed-Logistics'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(java_version as int)
    }
}

repositories {
    mavenLocal()
    maven { url = 'https://proxy-maven.covers1624.net/' }
    maven { url = 'https://maven.covers1624.net/' }
}

neoForge {
    version = neoforge_version

    runs {
        client { client() }
        server { server() }
    }

    mods {
        projectred_logistics {
            sourceSet(sourceSets.main)
        }
    }

    unitTest {
        enable()
        testedMod = mods.getByName('projectred_logistics')
    }
}

def useLocalProjectRed = providers.gradleProperty('use_local_projectred')
        .map { it.toBoolean() }
        .getOrElse(false)

dependencies {
    // Client rendering and exact multipart hit detection use the same CCL/CBM
    // APIs already required by ProjectRed.
    compileOnly "io.codechicken:CodeChickenLib:${minecraft_version}-${ccl_version}"
    compileOnly "io.codechicken:CBMultipart:${minecraft_version}-${cbm_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.2'

    if (useLocalProjectRed) {
        // Patched ProjectRed development build published with:
        // AUTO_GENERATED_VERSION=5.0-logistics-dev ./gradlew publishToMavenLocal
        compileOnly "mrtjp:ProjectRed:${projectred_local_version}:api"
        compileOnly "mrtjp:ProjectRed:${projectred_local_version}:core"
        compileOnly "mrtjp:ProjectRed:${projectred_local_version}:expansion"

        // Tests directly exercise the public pneumatic payload API, so the
        // API jar must also be available to the test source set/runtime.
        testImplementation "mrtjp:ProjectRed:${projectred_local_version}:api"

        // ModDev already places the compileOnly API on the development module
        // path. Adding the API again as runtimeOnly creates a duplicate Java
        // module, so only the actual runtime modules are listed here.
        runtimeOnly "mrtjp:ProjectRed:${projectred_local_version}:core"
        runtimeOnly "mrtjp:ProjectRed:${projectred_local_version}:expansion"
        // Development convenience: lets runClient test ProjectRed's external
        // red-alloy wire against redstone-capable pneumatic tubes.
        runtimeOnly "mrtjp:ProjectRed:${projectred_local_version}:transmission"
        runtimeOnly "io.codechicken:CodeChickenLib:${minecraft_version}-${ccl_version}"
        runtimeOnly "io.codechicken:CBMultipart:${minecraft_version}-${cbm_version}"
    } else {
        // Public release dependency. This path will become usable for the new
        // API once ProjectRed publishes the pneumatic extension upstream.
        compileOnly "mrtjp:ProjectRed-${minecraft_version}:${projectred_version}:api"
        compileOnly "mrtjp:ProjectRed-${minecraft_version}:${projectred_version}:core"
        compileOnly "mrtjp:ProjectRed-${minecraft_version}:${projectred_version}:expansion"
        testImplementation "mrtjp:ProjectRed-${minecraft_version}:${projectred_version}:api"
        runtimeOnly "mrtjp:ProjectRed-${minecraft_version}:${projectred_version}:core"
        runtimeOnly "mrtjp:ProjectRed-${minecraft_version}:${projectred_version}:expansion"
        runtimeOnly "mrtjp:ProjectRed-${minecraft_version}:${projectred_version}:transmission"
    }
}

processResources {
    def props = [
        minecraft_version: minecraft_version,
        neoforge_version: neoforge_version,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_version: mod_version
    ]
    inputs.properties(props)

    filesMatching('META-INF/neoforge.mods.toml') {
        expand(props)
    }
}


test {
    useJUnitPlatform()
    jvmArgs('-Xmx2G', '-Xms512M')
}
