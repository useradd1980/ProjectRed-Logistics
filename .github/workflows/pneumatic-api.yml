name: Generic pneumatic API prototype

on:
  pull_request:
    branches:
      - main
    paths:
      - 'upstream/**'
      - '.github/workflows/pneumatic-api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-upstream-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out ProjectRed Logistics
        uses: actions/checkout@v4

      - name: Check out pinned ProjectRed baseline
        uses: actions/checkout@v4
        with:
          repository: MrTJP/ProjectRed
          ref: e631f983c9b31c79f04deffa92ae5e68468326a0
          path: projectred
          persist-credentials: false

      - name: Verify and apply generic pneumatic API patches
        working-directory: projectred
        run: |
          PATCHES=(
            "0001-generic-pneumatic-payload-metadata.patch"
            "0002-generic-pneumatic-route-policy.patch"
            "0003-generic-pneumatic-tube-metadata.patch"
            "0004-generic-pneumatic-entry-policy.patch"
            "0005-generic-pneumatic-tube-connection-policy.patch"
            "0006-generic-pneumatic-low-load-power.patch"
          )

          for NAME in "${PATCHES[@]}"; do
            PATCH="$GITHUB_WORKSPACE/upstream/patches/$NAME"
            echo "Applying $NAME"
            git apply --check "$PATCH"
            git apply "$PATCH"
          done

          git diff --check

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test generic routing API and compile ProjectRed Expansion
        working-directory: projectred
        run: ./gradlew :api:compileJava :expansion:test :expansion:compileJava --no-daemon
