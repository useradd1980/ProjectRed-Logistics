name: Import RP2 Buffer Artwork

on:
  push:
    branches:
      - feat/pneumatic-payload-metadata
    paths:
      - .github/workflows/import-buffer-artwork.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Logistics branch
        uses: actions/checkout@v4
        with:
          ref: feat/pneumatic-payload-metadata
          fetch-depth: 0

      - name: Import original RP2 Buffer textures
        shell: bash
        run: |
          set -euo pipefail

          dest="src/main/resources/assets/projectred_logistics/textures/block"
          mkdir -p "$dest"

          base="https://raw.githubusercontent.com/Scrik/RedPower2-Port/b2e46ca4cd2d1ef09efcd328c244d478bfda0aa5/src/main/resources/assets/rpmachine/textures/blocks"

          curl -L --fail --retry 3 "$base/blockBufferTop.png" \
            -o "$dest/buffer_front.png"
          curl -L --fail --retry 3 "$base/blockBufferBottom.png" \
            -o "$dest/buffer_back.png"
          curl -L --fail --retry 3 "$base/blockBufferSide.png" \
            -o "$dest/buffer_side.png"

          file "$dest"/buffer_*.png

      - name: Point Buffer model at RP2 artwork
        shell: bash
        run: |
          cat > src/main/resources/assets/projectred_logistics/models/block/buffer.json <<'EOF'
          {
            "parent": "minecraft:block/cube_bottom_top",
            "textures": {
              "bottom": "projectred_logistics:block/buffer_back",
              "side": "projectred_logistics:block/buffer_side",
              "top": "projectred_logistics:block/buffer_front"
            }
          }
          EOF

      - name: Commit imported artwork
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/main/resources/assets/projectred_logistics/textures/block/buffer_front.png \
            src/main/resources/assets/projectred_logistics/textures/block/buffer_back.png \
            src/main/resources/assets/projectred_logistics/textures/block/buffer_side.png \
            src/main/resources/assets/projectred_logistics/models/block/buffer.json
          git commit -m "style: restore original RP2 Buffer block artwork"
          git push origin HEAD:feat/pneumatic-payload-metadata
