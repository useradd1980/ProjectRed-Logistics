name: ProjectRed Logistics build

on:
  push:
    branches:
      - feat/pneumatic-payload-metadata
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: projectred-logistics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out ProjectRed Logistics
        uses: actions/checkout@v4

      - name: Check out ProjectRed development fork
        uses: actions/checkout@v4
        with:
          repository: useradd1980/ProjectRed
          ref: feature/generic-pneumatic-api
          path: projectred
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish patched ProjectRed to Maven Local
        working-directory: projectred
        run: ./gradlew publishToMavenLocal --no-daemon
        env:
          AUTO_GENERATED_VERSION: 5.0-logistics-dev

      - name: Build and test ProjectRed Logistics
        run: ./gradlew build --console=plain --no-daemon
